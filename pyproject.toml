[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viet-asr"
version = "0.2.0"
description = "Ses -> metin + konuşmacı ayrıştırma, dil tespitli (Vietnamca, Türkçe; CPU, sherpa-onnx)"
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.12",
    "numpy",
    "soundfile",
    "soxr",
    "onnxruntime",
    "scipy",
    "faster-whisper>=1.1",  # Türkçe varsayılan model (CTranslate2)
]

[project.optional-dependencies]
dev = ["pytest", "import-linter", "httpx", "jiwer"]
server = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "redis>=5",
    "python-dotenv",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx",
    "websockets",  # canlı akış: WS /streams/{id}/ws (uvicorn)
]
bench = ["jiwer", "datasets<4.0", "sentencepiece"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viet_asr = ["infrastructure/db/migrations/script.py.mako", "interface/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["models: modeller indirilmiş olmalı (models/ klasörü)"]

# Katman kuralları: içteki katman dıştakini import edemez.
[tool.importlinter]
root_package = "viet_asr"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Temiz mimari katmanları"
type = "layers"
layers = [
    "viet_asr.interface",
    "viet_asr.infrastructure",
    "viet_asr.application",
    "viet_asr.domain",
]

[[tool.importlinter.contracts]]
name = "Domain ve application model kütüphanesi bilmez"
type = "forbidden"
source_modules = ["viet_asr.domain", "viet_asr.application"]
forbidden_modules = ["sherpa_onnx", "onnxruntime", "scipy", "soundfile", "soxr", "psycopg", "redis", "fastapi", "httpx", "sqlalchemy", "alembic", "faster_whisper", "ctranslate2"]
