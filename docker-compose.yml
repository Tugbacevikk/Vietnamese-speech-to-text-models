# Tüm sistem:  docker compose up -d --build
# Önce modeller: python scripts/download_models.py  (./models klasörüne)
#
# Çekirdek bütçesi: her worker süreci ONNX_THREADS çekirdek kullanır.
# worker-vi süreç sayısını kendisi hesaplar: kullanılabilir çekirdek / ONNX_THREADS
# (konteynere "cpus:" sınırı konduysa onu dikkate alır). worker-lid ve worker-tr
# 1 süreçle başlar; Türkçe yük artarsa CONCURRENCY değerini yükseltin. Toplam
# süreç x ONNX_THREADS çekirdek sayısını geçerse süreçler birbirini yavaşlatır.

x-app: &app
  build: .
  image: viet-asr:0.2.0
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgresql://asr:asr@postgres:5432/asr
    REDIS_URL: redis://redis:6379/0
    LANGUAGES: vi,tr
    VI_MODEL: zipformer-68m
    TR_MODEL: omnilingual-300m
    ONNX_THREADS: "2"
    NUM_SPEAKERS: "0"            # 0: sesten bul; istekte num_speakers verilebilir
    DIARIZER: cluster
    TASK_TIME_LIMIT: "1800"      # tek iş en fazla 30 dk
  volumes:
    - ./models:/models:ro
    - uploads:/data/uploads
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: asr, POSTGRES_PASSWORD: asr, POSTGRES_DB: asr}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asr"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # kuyruk yeniden başlatmada kaybolmasın
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    ports: ["8000:8000"]
    environment:
      <<: *env
      MAX_UPLOAD_MB: "100"

  worker-lid:          # dil tespiti: hafif, 1 süreç çoğu zaman yeter (~0,25 sn/ses)
    <<: *app
    command: ["celery", "-A", "viet_asr.interface.worker", "worker", "-Q", "lid",
              "-n", "lid@%h", "--loglevel=INFO"]
    environment:
      <<: *env
      WARMUP_LID: "1"
      CONCURRENCY: "1"

  worker-vi:           # Vietnamca: Zipformer ~0,5 GB/süreç
    <<: *app
    command: ["celery", "-A", "viet_asr.interface.worker", "worker", "-Q", "asr.vi",
              "-n", "vi@%h", "--loglevel=INFO"]
    environment:
      <<: *env
      WARMUP_LANGS: vi
      CONCURRENCY: auto

  worker-tr:           # Türkçe: Omnilingual ~0,5 GB/süreç (Whisper turbo seçilirse ~1,6 GB)
    <<: *app
    command: ["celery", "-A", "viet_asr.interface.worker", "worker", "-Q", "asr.tr",
              "-n", "tr@%h", "--loglevel=INFO"]
    environment:
      <<: *env
      WARMUP_LANGS: tr
      CONCURRENCY: "1"

  dispatcher:          # outbox -> webhook
    <<: *app
    command: ["python", "-m", "viet_asr.interface.dispatcher"]

volumes:
  pgdata:
  redisdata:
  uploads:
